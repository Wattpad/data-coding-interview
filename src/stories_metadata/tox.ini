[tox]
# envlist indicates which versions of python tox will run with
# in this case python 3.11 must be available for this to work
envlist = py311
skipsdist = true

[testenv]
passenv = *
# install pytest in the virtualenv where commands will be executed
deps = pytest == 9.1.1
       # The pyspark version and the spark version used for tests are the same
       # A limited version of spark is installed as part of pyspark.
       # Held at the 3.5 line to match the Spark 3.5.6 on EMR 7.13 rather than
       # tracking the latest pyspark release.
       pyspark == 3.5.6
       chispa == 0.12.0
       -rrequirements.txt
commands =
    pytest -v -s .
