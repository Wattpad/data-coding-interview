[tox]
# envlist indicates which versions of python tox will run with
# in this case python 3.11 must be available for this to work
envlist = py311
skipsdist = true

[testenv]
passenv = *
# install pytest in the virtualenv where commands will be executed
# This package is pure csv/pydantic and imports no Spark, so pyspark and chispa
# are not installed here.
deps = pytest == 9.1.1
       -rrequirements.txt
commands =
    pytest -v -s .
